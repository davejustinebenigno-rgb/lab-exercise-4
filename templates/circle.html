{% extends "base.html" %}

{% block title %}Circle Calculator | Dave Benigno{% endblock %}

{% block content %}

<section class="page-section calculator-section">

    <div class="section-heading">
        <p class="eyebrow">PROJECT / 02</p>
        <h1>Circle Area.</h1>
    </div>

    <div class="calculator-card">

        <p>
            Enter the radius of a circle to calculate
            its area.
        </p>

        <form method="POST">

            <label for="radius">
                Radius
            </label>

            <input
                type="number"
                id="radius"
                name="radius"
                min="0"
                step="any"
                placeholder="Enter radius"
                required
            >

            <button type="submit">
                Calculate Area
            </button>

        </form>

        {% if result is not none %}

        <div class="result-box">
            <span>AREA</span>
            <strong>{{ result }}</strong>
        </div>

        {% endif %}

        <a href="{{ url_for('works') }}" class="back-link">
            ← Back to Works
        </a>

    </div>

</section>

{% endblock %}
