<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Dave Benigno{% endblock %}
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>


<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-container">

            <!-- LOGO -->
            <a href="{{ url_for('index') }}" class="logo">
                DB
            </a>


            <!-- NAVIGATION -->
            <div class="nav-links">

                <a href="{{ url_for('index') }}">
                    Home
                </a>

                <a href="{{ url_for('profile') }}">
                    Profile
                </a>

                <a href="{{ url_for('works') }}">
                    Works
                </a>

                <a href="{{ url_for('contact') }}">
                    Contact
                </a>

            </div>

        </div>

    </nav>


    <!-- PAGE CONTENT -->
    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 Dave Justine Benigno
        </p>

    </footer>


</body>

</html>
